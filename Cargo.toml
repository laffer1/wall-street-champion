[package]
name = "wall-street-champion"
version = "0.1.0"
edition = "2021"
description = "Stock trader game: turn $100k into $1M in 26 weeks. Vulkan + FSR 1.x."
license = "MIT"

[dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
